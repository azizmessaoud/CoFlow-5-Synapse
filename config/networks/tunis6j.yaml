# Overrides of simulation.yaml > demand for this network. The real street grid
# has many more entry roads than the schematic one and saturates sooner.
demand:
  base_vehicles_per_hour: 2400
  bus_headway: 900                 # s: one TRANSTU bus per line and direction every 15 min (assumed)

# Scenario event locations. scenarios.yaml and training refer to them as "@name".
places:
  incident_edge: "577010716#1"      # Av. Habib Bourguiba eastbound, between J6 and J1
  incident_edge_b: "10641416#1"     # Av. Habib Bourguiba westbound, between J1 and J6
  incident_edge_c: "577010716#0"    # Av. Habib Bourguiba eastbound, just east of J6
  training_incident_edge: "10641416#2"  # Av. Habib Bourguiba westbound, nearer J6
  sensor_fault_tls: J1              # Place du 14 Janvier 2011
  sensor_fault_tls_b: J4            # Av. Habib Thameur x Rue de Rome
  flood_edge: "26280306#2"          # Av. Habib Thameur, J5 towards J4
  surge_towards: J1
